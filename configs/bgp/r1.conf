frr version 10.5
frr defaults traditional
hostname r1
!
router bgp 100
 bgp router-id 172.16.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.12.2 remote-as 100
 neighbor 10.0.13.2 remote-as 100
 neighbor 10.0.16.2 remote-as 300
 !
 address-family ipv4 unicast
  network 10.0.12.0/30
  network 10.0.13.0/30
  network 10.0.16.0/30
  network 192.168.1.0/24
  neighbor 10.0.12.2 activate
  neighbor 10.0.12.2 next-hop-self
  neighbor 10.0.13.2 activate
  neighbor 10.0.13.2 next-hop-self
  neighbor 10.0.16.2 activate
 exit-address-family
!
line vty
!
