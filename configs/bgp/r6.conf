frr version 10.5
frr defaults traditional
hostname r6
!
router bgp 300
 bgp router-id 172.16.0.6
 no bgp ebgp-requires-policy
 neighbor 10.0.56.1 remote-as 200
 neighbor 10.0.16.1 remote-as 100
 !
 address-family ipv4 unicast
  network 10.0.56.0/30
  network 10.0.16.0/30
  network 192.168.6.0/24
  neighbor 10.0.56.1 activate
  neighbor 10.0.16.1 activate
 exit-address-family
!
line vty
!
