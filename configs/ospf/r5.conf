frr version 10.5
frr defaults traditional
hostname r5
!
interface r5-r4
 ip ospf cost 10
 ip ospf network point-to-point
!
interface r5-r6
 ip ospf cost 10
 ip ospf network point-to-point
!
router ospf
 ospf router-id 172.16.0.5
 network 10.0.45.0/30 area 0
 network 10.0.56.0/30 area 0
 network 192.168.5.0/24 area 0
!
line vty
!
