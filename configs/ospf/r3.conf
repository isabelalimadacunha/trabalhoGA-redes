frr version 10.5
frr defaults traditional
hostname r3
!
interface r3-r2
 ip ospf cost 10
 ip ospf network point-to-point
!
interface r3-r1
 ip ospf cost 30
 ip ospf network point-to-point
!
interface r3-r4
 ip ospf cost 10
 ip ospf network point-to-point
!
router ospf
 ospf router-id 172.16.0.3
 network 10.0.23.0/30 area 0
 network 10.0.13.0/30 area 0
 network 10.0.34.0/30 area 0
 network 192.168.3.0/24 area 0
!
line vty
!
