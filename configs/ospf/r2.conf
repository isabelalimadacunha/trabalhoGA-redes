frr version 10.5
frr defaults traditional
hostname r2
!
interface r2-r1
 ip ospf cost 10
 ip ospf network point-to-point
!
interface r2-r3
 ip ospf cost 10
 ip ospf network point-to-point
!
router ospf
 ospf router-id 172.16.0.2
 passive-interface r2-h2
 network 10.0.12.0/30 area 0
 network 10.0.23.0/30 area 0
 network 192.168.2.0/24 area 0
!
line vty
!
